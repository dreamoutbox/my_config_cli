name: CI

on:
  push:
    branches:
      - main
      - add-docker-test
  pull_request:
    branches:
      - main
      - add-docker-test

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run linter
        run: ./lint.sh

      - name: Run tests
        run: ./test.sh

      - name: Build binary
        run: ./build.sh

  docker-test:
    name: Docker Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Docker test
        run: ./docker-test.sh
